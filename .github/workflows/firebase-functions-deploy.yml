name: Deploy Cloud Functions

# Deploys functions/ to Firebase automatically, so no local CLI is
# needed. Runs on pushes to main that touch the functions code (or this
# workflow / firebase.json), and can be started by hand from the
# Actions tab via "Run workflow".
#
# Auth reuses the FIREBASE_SERVICE_ACCOUNT repo secret that the hosting
# deploy workflow already uses. Deploying functions needs broader
# permissions than hosting: the service account must have the Editor
# role (or equivalent) in Google Cloud IAM on project hawaa-air-27548.

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/firebase-functions-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Run function tests
        working-directory: functions
        run: npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy functions
        run: npx -y firebase-tools@latest deploy --only functions --project hawaa-air-27548 --force
