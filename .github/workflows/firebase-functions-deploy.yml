name: Deploy Cloud Functions and Firestore rules

# Deploys functions/ AND firestore.rules to Firebase automatically, so no
# local CLI is needed. Runs on pushes to main that touch either (or this
# workflow / firebase.json), and can be started by hand from the Actions
# tab via "Run workflow".
#
# The rules ship here rather than with Hosting deliberately: the admin
# portal's role checks live in firestore.rules, and rules that lag behind
# the functions would either lock the portal out of its own data or leave
# an old, looser policy in force. Deploying them together keeps the two
# halves of the permission model in step.
#
# Auth reuses the FIREBASE_SERVICE_ACCOUNT repo secret that the hosting
# deploy workflow already uses. Deploying functions needs far broader
# permissions than hosting; the service account on hawaa-air-27548 needs
# Editor plus Service Account User, Cloud Functions Admin and Secret
# Manager Admin — the last three because Editor deliberately excludes
# granting permissions, which a functions deploy has to do.

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/firebase-functions-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Run function tests
        working-directory: functions
        run: npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy functions and Firestore rules
        run: npx -y firebase-tools@latest deploy --only functions,firestore:rules --project hawaa-air-27548 --force
